[browser]
gatherUsageStats = false

[server]
headless = false
address = "localhost"
port = 8501
fileWatcherType = "auto"
runOnSave = true
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"
